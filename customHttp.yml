# AWS Amplify custom response headers (repo-based; Amplify reads this file automatically).
# Replaces the Cache-Control + security headers that server.js sets for other hosts.
customHeaders:
  # Hashed assets — cache hard for a year.
  - pattern: '**/*.@(js|css|jpg|jpeg|png|svg|webp|woff|woff2|ico)'
    headers:
      - key: Cache-Control
        value: 'public, max-age=31536000, immutable'
  # HTML — always revalidate so content updates ship immediately.
  - pattern: '**/*.html'
    headers:
      - key: Cache-Control
        value: 'public, max-age=0, must-revalidate'
  # Baseline security headers on every response.
  - pattern: '**/*'
    headers:
      - key: X-Content-Type-Options
        value: 'nosniff'
      - key: X-Frame-Options
        value: 'SAMEORIGIN'
      - key: Referrer-Policy
        value: 'strict-origin-when-cross-origin'
      - key: Permissions-Policy
        value: 'camera=(), microphone=(), geolocation=()'
